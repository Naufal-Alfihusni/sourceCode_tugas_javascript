<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Menghitung Luas Persegi Panjang, Bujur Sangkar, dan Segitiga Dengan JS
    </title>
  </head>
  <body>
    <script>
      document.write(
        "<h1>Menghitung Luas Persegi Panjang, Bujur Sangkar, dan Segitiga Menggunakan JavaScript</h1>",
      );

      //mengitung luas persegi panjang
      var panjang = 15;
      var lebar = 10;

      //rumus luas persegi panjang
      let luasPersegiPanjang = panjang * lebar;
      document.write(
        "</br> Luas persegi panjang dengan memiliki panjang " +
          panjang +
          " dan lebar " +
          lebar +
          " adalah " +
          luasPersegiPanjang,
      );

      //mengitung luas persegi
      var sisi = 20;

      //rumus luas persegi
      let luasBujurSangkar = sisi * sisi;
      document.write(
        "</br> Luas bujur sangkar dengan memiliki sisi " +
          sisi +
          " adalah " +
          luasBujurSangkar,
      );

      //menghitung luas segitiga
      var alas = 10;
      var tinggi = 20;

      //rumus luas segitiga
      let luasSegitiga = 0.5 * alas * tinggi;
      document.write(
        "</br> Luas segitiga dengan memiliki alas " +
          alas +
          " dan tinggi " +
          tinggi +
          " adalah " +
          luasSegitiga,
      );
    </script>
  </body>
</html>
